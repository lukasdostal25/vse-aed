<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moje předměty</title>
<meta name="description" content="Rozcestník studijních portálů.">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<style>
:root { --bg: #fbfaf7; --surface: #fff; --ink: #1d1f23; --ink-2: #555b66; --line: #e3e0d8; --econ: #c8102e; --stat: #0f6a86; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #121418; --surface: #1a1d22; --ink: #e8e6e1; --ink-2: #a3a8b1; --line: #2e333a; --econ: #ff5a6e; --stat: #5cc0dd; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 16px 24px; }
main { width: 100%; max-width: 480px; margin: 0 auto; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.01em; }
p { margin: 0 0 24px; color: var(--ink-2); }
.c { display: block; padding: 20px; margin-bottom: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid; border-radius: 14px; color: inherit; text-decoration: none; }
.c b { display: block; font-size: 20px; } .c span { color: var(--ink-2); font-size: 15px; }
.e { border-left-color: var(--econ); } .s { border-left-color: var(--stat); }
small a { color: var(--ink-2); }
</style>
</head>
<body>
<main>
  <h1>Moje předměty</h1>
  <p>Vyber si, co se chceš učit.</p>
  <a class="c e" href="ekonomie/"><b>Ekonomie</b><span>Učebnice The Economy 2.0, přednášky a trenažér</span></a>
  <a class="c s" href="statistika/"><b>Statistika</b><span>4ST102: teorie ze cvičení, trenažér a test nanečisto</span></a>
  <small><a href="aed/">Původní přípravný portál AED</a></small>
</main>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
